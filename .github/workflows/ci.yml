name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pipe-flow-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: pipe-flow-api } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  frontend-result-identity:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend-result-identity } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm ci
      - run: npm test

  testing-ci:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: testing-ci } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.txt
      - name: Regression gate (known failures contained by strict xfail)
        run: python -m pytest -q -rxX
      - name: Known-failure check (example suite with --runxfail, checked against the allowlist)
        run: python -m pytest example -q -rf --runxfail -p allowlist
